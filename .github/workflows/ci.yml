# VetPulse CI
#
# Three jobs, matching how the repo actually runs locally:
#   backend      — lint, typecheck and the 63 Supertest integration tests against a
#                  real Postgres 16 service container (migrations are applied by
#                  the test setup; the Python CSV validator is exercised through
#                  the /api/imports tests, so a real Python is required).
#   web          — lint, typecheck, jsdom tests and the production build.
#   data-service — the 18 Python validator unit tests (stdlib only, no pip deps).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vetpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The vitest setup applies prisma migrate deploy and copies this into
      # DATABASE_URL for the app. Node 22 + postgres client on the runner.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vetpulse_test
      # The import tests spawn the Python validator service (stdlib only).
      PYTHON_BIN: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Integration tests (63)
        run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  data-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validator unit tests
        run: python3 -m unittest discover -s tests -v
