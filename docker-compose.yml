# VetPulse — one-command production-style stack.
#
#   docker compose up --build
#
# then open http://localhost:4000 and sign in with a seeded demo account
# (seed data is generated during local development; see README "Seeding").
#
# For local development this file doubles as a plain postgres provider:
#   docker compose up -d db
#   -> postgres on localhost:5433 (user postgres / password postgres)
# then point TEST_DATABASE_URL / DATABASE_URL at it for the app test suites.
#
# NOTE: this build path was written for CI/VM use — the development machine
# used to build VetPulse has no Docker/WSL2 available, so the image itself was
# not executed locally. The local flow (embedded postgres, see README) is the
# tested path.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vetpulse
    volumes:
      - vetpulse-pgdata:/var/lib/postgresql/data
    ports:
      # host 5433 so a locally-run API can share this instance (5432 is
      # deliberately not used to avoid clashing with real installs)
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vetpulse
      # Override this in any non-demo deployment. Session tokens are signed
      # with it — leaking it lets anyone mint admin sessions.
      JWT_SECRET: change-me-in-production
      PYTHON_BIN: python3
      DATA_SERVICE_DIR: /app/data-service
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  vetpulse-pgdata:
